<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARD Regression Model</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">ARD Regression Model Interface</h1>
        
        <!-- Dataset Upload and Validation Section -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Step 1: Upload and Validate Dataset</h5>
            </div>
            <div class="card-body">
                <form id="validateForm" class="mb-3">
                    <div class="mb-3">
                        <label for="datasetFile" class="form-label">Choose Dataset (CSV)</label>
                        <input type="file" class="form-control" id="datasetFile" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Validate Dataset</button>
                </form>
                <div id="validationResults" class="alert d-none"></div>
            </div>
        </div>

        <!-- Model Training Section -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Step 2: Train Model</h5>
            </div>
            <div class="card-body">
                <form id="trainForm">
                    <div class="mb-3">
                        <label for="targetColumn" class="form-label">Target Column</label>
                        <select class="form-select" id="targetColumn" required disabled>
                            <option value="">Select target column</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success" disabled>Train Model</button>
                </form>
                <div id="trainingResults" class="alert d-none mt-3"></div>
            </div>
        </div>

        <!-- Prediction Section -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Step 3: Make Predictions</h5>
            </div>
            <div class="card-body">
                <form id="predictForm">
                    <div class="mb-3">
                        <label for="predictionFile" class="form-label">Upload Prediction Data (CSV)</label>
                        <input type="file" class="form-control" id="predictionFile" accept=".csv" required>
                        <small class="form-text text-muted">The CSV should contain the same features used during training</small>
                    </div>
                    <button type="submit" class="btn btn-primary" disabled>Predict</button>
                </form>
                <div id="predictionResults" class="alert d-none mt-3"></div>
                <div id="predictionsTable" class="mt-3">
                    <!-- Predictions table will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
